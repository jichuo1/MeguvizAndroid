name: Verify development candidate manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install exact Android SDK
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = $env:ANDROID_HOME.Replace('\','/')
          "sdk.dir=$sdk" | Set-Content local.properties
          "sdk.dir=$sdk" | Set-Content samples/local.properties
      - name: Current source host gate
        shell: pwsh
        run: ./scripts/run-gradle.ps1 verifyHost
  # No remote artifact upload and no automatic push/PR execution.
  # Device/performance/release acceptance still requires its explicit controlled matrix.
