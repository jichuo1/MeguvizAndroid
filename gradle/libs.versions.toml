[versions]
agp = "9.4.1"
core = "1.19.1"
appcompat = "1.8.0"
lifecycle = "2.8.7"
fragment = "1.9.0"
junit = "4.13.2"

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "core" }
